name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mosaico-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Mosaico.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Mosaico.apk --title "Mosaico (última versión)" \
            --notes "APK compilado automáticamente desde la rama main. Descarga Mosaico.apk en tu teléfono e instálalo."
